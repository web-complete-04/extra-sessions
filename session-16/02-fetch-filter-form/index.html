<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <script src="main.js" defer></script>
</head>

<body>
    <div class="container">
        <h1 class="mt-5">Rick and Morty search</h1>

        <div class="row">
            <div class="col-12 col-lg-6">

                <section class="border rounded my-5 p-3 ">
                    <h2>Search for character</h2>
                    <form id="search-form">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name: </label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="Character name: e.g. Rick" value="Rick">
                        </div>
        
                        <div class="mb-3">
                            <label for="gender" class="form-label">Gender: </label>
                            <input type="text" class="form-control" id="gender" name="gender" placeholder="Character gender: e.g. female, male, genderless or unknown" value="male">
                        </div>
        
                        <div class="mb-3">
                            <button class="btn btn-primary">Search</button>
                        </div>
                    </form>
                </section>

            </div>
        </div>

        <section>
            <h2>Characters</h2>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
